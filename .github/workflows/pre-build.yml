name: Pre-Build

on:
  release:
    types: [released]

permissions:
  contents: write
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pre-build dev container image
        uses: devcontainers/ci@v0.3
        with:
          imageName: ghcr.io/codecafe-lab-it-solutions/frappe_codespace
          cacheFrom: ghcr.io/codecafe-lab-it-solutions/frappe_codespace
          push: always
