name: Pre-Build

on:
  release:
    types: [released]

permissions:
  contents: write
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Pre-build dev container image
        uses: devcontainers/ci@v0.3
        with:
          imageName: ghcr.io/codecafe-lab-it-solutions/frappe_codespace
          cacheFrom: ghcr.io/codecafe-lab-it-solutions/frappe_codespace
          push: always
